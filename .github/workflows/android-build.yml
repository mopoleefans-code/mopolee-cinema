
name: Build MOPOLEE CINEMA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MOPOLEE CINEMA
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0'

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build MOPOLEE CINEMA Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload MOPOLEE CINEMA APK
        uses: actions/upload-artifact@v4
        with:
          name: MOPOLEE-CINEMA-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

